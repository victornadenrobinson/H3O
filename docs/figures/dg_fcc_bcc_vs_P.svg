<path d="M697.2 547.0 L704.2 554.0 L697.2 561.0 L690.2 554.0 Z" fill="var(--surface)" class="mineh"><title></title></path><text x="709.1999999999999" y="558">this work, H2.25O (not H2O)</text>
<text x="24" y="576" style="font-size:11px">Not shown: Wilson at 4000 GPa (3000 K: -71.3 +- 2.3). Ours: MLP level (fine-tuned GRACE), classical nuclei, no correction to PBE, statistical errors only.</text>
<text x="24" y="592" style="font-size:11px">The 32/54 O points were still drifting down by 4-5 meV/atom; the 108/128 O points at 5000 K ran 1.5 ps per lambda value.</text>
